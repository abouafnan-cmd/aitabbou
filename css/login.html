<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة التعليم التفاعلي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📚</span>
                    <h1>منصة التعليم التفاعلي</h1>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="register.html">إنشاء حساب</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="dashboard">
        <div class="container">
            <div class="form-container">
                <h2 style="text-align: center; margin-bottom: 2rem;">تسجيل الدخول</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="userType">نوع المستخدم</label>
                        <select id="userType" name="userType" required>
                            <option value="">اختر نوع المستخدم</option>
                            <option value="student">طالب</option>
                            <option value="teacher">معلم</option>
                            <option value="admin">مسؤول</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">تسجيل الدخول</button>
                </form>
                
                <div style="text-align: center; margin-top: 1rem;">
                    <p>ليس لديك حساب؟ <a href="register.html">أنشئ حساب جديد</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="copyright">
                <p>© 2024 منصة التعليم التفاعلي. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
