<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إعدادات الشاشة للهاتف لمنع التكبير العشوائي وجعله كالتطبيق -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>مدير التلاميذ</title>
    
    <!-- ربط ملف التصميم -->
    <link rel="stylesheet" href="style.css">

    <!-- إعدادات تطبيق الهاتف (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50"> <!-- لون الشريط العلوي في الهاتف -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- إعدادات مخصصة لهواتف الآيفون (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تلاميذي">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
    <header>
        <h1>نظام إدارة وتتبع التلاميذ</h1>
        <nav>
            <button onclick="showTab('daily-entry')" class="active" id="btn-daily-entry">التسجيل اليومي</button>
            <button onclick="showTab('reports')" id="btn-reports">التقارير</button>
            <button onclick="showTab('settings')" id="btn-settings">إدارة التلاميذ</button>
        </nav>
    </header>

    <main>
        <!-- قسم التسجيل اليومي -->
        <section id="daily-entry" class="tab-content active">
            <h2>التسجيل اليومي</h2>
            <div class="controls">
                <input type="date" id="record-date" required>
                <select id="class-select" onchange="loadStudentsForEntry()">
                    <option value="">اختر القسم...</option>
                </select>
            </div>
            <div id="students-list-container" style="overflow-x: auto;"> <!-- للسماح بالتمرير الأفقي في الجداول على الهاتف -->
                <table id="entry-table">
                    <thead>
                        <tr>
                            <th>التلميذ</th>
                            <th>الحضور</th>
                            <th>الإعداد القبلي</th>
                        </tr>
                    </thead>
                    <tbody id="entry-tbody">
                        <!-- قائمة التلاميذ ستظهر هنا -->
                    </tbody>
                </table>
                <button class="save-btn" onclick="saveDailyRecords()">حفظ السجل اليومي</button>
            </div>
        </section>

        <!-- قسم التقارير -->
        <section id="reports" class="tab-content" style="display: none;">
            <h2>تقارير التلاميذ</h2>
            <div class="controls">
                <select id="report-class-select" onchange="generateReport()">
                    <option value="">اختر القسم...</option>
                </select>
            </div>
            <div id="report-container" style="overflow-x: auto;">
                <!-- التقرير سيظهر هنا -->
            </div>
        </section>

        <!-- قسم الإعدادات -->
        <section id="settings" class="tab-content" style="display: none;">
            <h2>إدارة البيانات</h2>
            <div class="add-student-form">
                <input type="text" id="new-student-name" placeholder="اسم التلميذ">
                <select id="settings-class-select"></select>
                <button onclick="addStudent()">إضافة تلميذ</button>
            </div>
            <hr>
            <div class="backup-controls">
                <button onclick="exportData()" style="width: 100%; margin-bottom: 10px;">📥 تحميل البيانات (نسخة احتياطية)</button>
                <label for="import-file" style="display: block; text-align: center; background: #e74c3c; color: white; padding: 10px; border-radius: 4px; cursor: pointer;">
                    📤 استعادة البيانات من ملف
                </label>
                <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="display: none;">
            </div>
        </section>
    </main>

    <!-- ربط ملف الجافاسكريبت الرئيسي -->
    <script src="script.js"></script>
</body>
</html>
